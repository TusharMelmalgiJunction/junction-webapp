# nginx site for the Junction web app. Copy to /etc/nginx/sites-available/app.junctionverse.com
# and symlink into sites-enabled. Get the certificate first (see deploy/DEPLOY.md).

server {
    listen 80;
    listen [::]:80;
    server_name app.junctionverse.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.junctionverse.com;

    ssl_certificate     /etc/letsencrypt/live/app.junctionverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.junctionverse.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Same layout as admin.junctionverse.com: the repo is cloned next to the other apps and
    # nginx serves its build output directly. Deploy = git pull, npm ci, npm run build.
    root /home/ubuntu/junction/backend/junction-webapp/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build files (index-<hash>.js / .css) never change: cache for a year.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        include /etc/nginx/snippets/junction-app-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Images, fonts and other static files (not hashed): cache for a day.
    location ~* "\.(png|jpg|jpeg|gif|svg|ico|webp|woff2?|css)$" {
        include /etc/nginx/snippets/junction-app-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Every app route (/listing/<id>, /chats, ...) is served by index.html.
    # Never cache the HTML, so a new deploy is picked up on the next visit.
    location / {
        include /etc/nginx/snippets/junction-app-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
