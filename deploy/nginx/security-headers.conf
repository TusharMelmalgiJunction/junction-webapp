# Generated by `npm run headers:nginx` from deploy/securityHeaders.js. Do not edit by hand.
# nginx drops server-level add_header lines inside any location that has its own add_header,
# so include this file in every location block.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https://api.junctionverse.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data: blob: https://*.amazonaws.com; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
